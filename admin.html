<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plus+ 管理画面</title>
<style>
:root{--bg:#fff5f9;--card:#ffffff;--text:#5a2e42;--sub:#a15a78;--accent:#ff6f9f;--line:#ffd6e6;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);}
#lockScreen{position:fixed;inset:0;background:linear-gradient(160deg,#2a1420,#4a1f33);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#fff;}
#lockScreen h1{font-size:26px;letter-spacing:2px;margin-bottom:24px;font-weight:300;}
#lockScreen input{font-size:24px;letter-spacing:8px;text-align:center;width:180px;padding:10px;border-radius:12px;border:none;margin-bottom:16px;}
#lockScreen button{padding:10px 24px;border-radius:20px;border:none;background:var(--accent);color:#fff;font-size:16px;}
#lockError{color:#ffb3c6;font-size:13px;height:18px;}
#app{display:none;max-width:720px;margin:0 auto;padding:12px;}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.tab{flex:0 0 auto;padding:9px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;white-space:nowrap;cursor:pointer;color:var(--sub);}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
select,input,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);font-size:14px;margin-bottom:8px;background:#fff;color:var(--text);}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:2px;}
button{padding:9px 14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;}
button.secondary{background:#eee;color:var(--text);}
button.danger{background:#e05070;color:#fff;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;}
th{color:var(--sub);font-weight:normal;}
.row{display:flex;gap:6px;align-items:center;}
.row>*{flex:1;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;}
.tag.done{background:#d4f5e0;color:#1a7a45;}
.tag.pending{background:#ffe4cc;color:#a5561a;}
.section-title{font-size:15px;font-weight:bold;margin:0 0 10px;}
.small{font-size:11px;color:var(--sub);}
</style>
</head>
<body>

<div id="lockScreen">
  <h1>Plus+ 管理画面</h1>
  <input type="password" id="entryInput" inputmode="numeric" maxlength="8" placeholder="パスコード">
  <div id="lockError"></div>
  <button onclick="tryEntry()">開く</button>
</div>

<div id="app">
  <div class="tabs">
    <div class="tab active" data-tab="status">達成状況</div>
    <div class="tab" data-tab="master">コンパニオン管理</div>
    <div class="tab" data-tab="payout">支給履歴</div>
    <div class="tab" data-tab="bingo">ビンゴ内容編集</div>
  </div>

  <div class="panel active" id="panel-status">
    <div class="card">
      <div class="section-title">達成状況(統括データ)</div>
      <label>店舗で絞り込み</label>
      <select id="statusStoreFilter">
        <option value="">全店舗</option>
      </select>
      <div style="overflow-x:auto;">
        <table id="statusTable">
          <thead><tr><th>店舗</th><th>名前</th><th>月</th><th>達成ライン</th><th>ボーナス目安</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-master">
    <div class="card">
      <div class="section-title">コンパニオン登録</div>
      <div class="row">
        <select id="mStore"></select>
        <input type="text" id="mName" placeholder="名前">
      </div>
      <select id="mCategory">
        <option value="在籍女性">在籍女性</option>
        <option value="新人女性">新人女性</option>
      </select>
      <button onclick="addCompanion()">＋ 追加</button>
    </div>
    <div class="card">
      <div class="section-title">登録一覧</div>
      <select id="mListStoreFilter"></select>
      <div style="overflow-x:auto;">
        <table id="masterTable">
          <thead><tr><th>店舗</th><th>名前</th><th>区分</th><th>状態</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-payout">
    <div class="card">
      <div class="section-title">支給履歴の入力</div>
      <select id="pStore"></select>
      <input type="text" id="pName" placeholder="名前">
      <input type="text" id="pMonth" placeholder="対象月 (例: 2026-09)">
      <input type="number" id="pAmount" placeholder="支給額">
      <input type="text" id="pStaff" placeholder="支給担当スタッフ">
      <button onclick="addPayout()">＋ 登録(未支給として追加)</button>
    </div>
    <div class="card">
      <div class="section-title">履歴一覧</div>
      <div style="overflow-x:auto;">
        <table id="payoutTable">
          <thead><tr><th>店舗</th><th>名前</th><th>月</th><th>金額</th><th>状態</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-bingo">
    <div class="card">
      <div class="section-title">ビンゴ内容編集(16マス)</div>
      <div class="small">改行はそのまま反映されます。保存すると全店舗のビンゴカードに反映されます。</div>
      <div id="bingoEditGrid"></div>
      <button onclick="saveBingoConfig()">保存する</button>
      <div class="small" id="bingoSaveMsg"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjbCSxtMM5zsoaIZBX6dw9q2rebhCCHeg",
  authDomain: "plus-bingo-8f37d.firebaseapp.com",
  projectId: "plus-bingo-8f37d",
  storageBucket: "plus-bingo-8f37d.firebasestorage.app",
  messagingSenderId: "617575866890",
  appId: "1:617575866890:web:db9eec940477abf238b5f3"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const ADMIN_PASS = "2580";
const PRESET_STORES = ["梅田店","十三店","難波店","東大阪店"];
const DEFAULT_ITEMS = ["出勤\n8日以上","出勤\n15日以上","通常日記\n10投稿","オキニトーク\n30人送信","姫予約\n3件","本指名\n5名","120分コース\n予約","動画日記\n5本","口コミ\n3件","求人口コミ\n1件投稿","性病検査","マイガール限定日記\n10本","イベント\n翌日出勤","YouTube\n出演","ショート動画\n出演","女性応援ポイント\n1000pt獲得"];

window.tryEntry = () => {
  const v = document.getElementById("entryInput").value;
  if (v === ADMIN_PASS) {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    initAll();
  } else {
    document.getElementById("lockError").textContent = "パスコードが違います";
  }
};

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-" + t.dataset.tab).classList.add("active");
  });
});

function fillStoreSelects(){
  ["statusStoreFilter","mStore","mListStoreFilter","pStore"].forEach(id => {
    const sel = document.getElementById(id);
    PRESET_STORES.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = s;
      sel.appendChild(opt);
    });
  });
}

// ---------- 達成状況 ----------
function watchStatus(){
  onSnapshot(collection(db,"progress"), (snap) => {
    const filter = document.getElementById("statusStoreFilter").value;
    const rows = [];
    snap.forEach(d => {
      const p = d.data();
      if (filter && p.store !== filter) return;
      rows.push(p);
    });
    rows.sort((a,b) => (b.lineCount||0) - (a.lineCount||0));
    const tbody = document.querySelector("#statusTable tbody");
    tbody.innerHTML = rows.map(p => `<tr><td>${p.store}</td><td>${p.name}</td><td>${p.monthKey}</td><td>${p.lineCount||0}本</td><td>¥${(p.lineCount||0)*500}</td></tr>`).join("");
  });
}
document.getElementById("statusStoreFilter").addEventListener("change", watchStatus);

// ---------- コンパニオン管理 ----------
window.addCompanion = async () => {
  const store = document.getElementById("mStore").value;
  const name = document.getElementById("mName").value.trim();
  const category = document.getElementById("mCategory").value;
  if (!name) { alert("名前を入力してください"); return; }
  await addDoc(collection(db,"companions"), {store, name, category, active:true, createdAt:new Date()});
  document.getElementById("mName").value = "";
};

function watchMaster(){
  onSnapshot(collection(db,"companions"), (snap) => {
    const filter = document.getElementById("mListStoreFilter").value;
    const rows = [];
    snap.forEach(d => {
      const c = d.data();
      if (filter && c.store !== filter) return;
      rows.push({id:d.id, ...c});
    });
    const tbody = document.querySelector("#masterTable tbody");
    tbody.innerHTML = rows.map(c => `
      <tr>
        <td>${c.store}</td><td>${c.name}</td><td>${c.category}</td>
        <td><span class="tag ${c.active ? 'done':'pending'}">${c.active ? '在籍':'退店'}</span></td>
        <td><button class="secondary" onclick="toggleActive('${c.id}', ${!c.active})">${c.active ? '退店にする':'復帰'}</button></td>
      </tr>`).join("");
  });
}
window.toggleActive = async (id, newVal) => {
  await updateDoc(doc(db,"companions",id), {active:newVal});
};
document.getElementById("mListStoreFilter").addEventListener("change", watchMaster);

// ---------- 支給履歴 ----------
window.addPayout = async () => {
  const store = document.getElementById("pStore").value;
  const name = document.getElementById("pName").value.trim();
  const monthKey = document.getElementById("pMonth").value.trim();
  const amount = Number(document.getElementById("pAmount").value) || 0;
  const staff = document.getElementById("pStaff").value.trim();
  if (!name || !monthKey || !amount) { alert("名前・対象月・支給額を入力してください"); return; }
  await addDoc(collection(db,"payouts"), {store, name, monthKey, amount, staff, status:"未支給", createdAt:new Date()});
  document.getElementById("pName").value = "";
  document.getElementById("pMonth").value = "";
  document.getElementById("pAmount").value = "";
  document.getElementById("pStaff").value = "";
};

function watchPayouts(){
  onSnapshot(collection(db,"payouts"), (snap) => {
    const rows = [];
    snap.forEach(d => rows.push({id:d.id, ...d.data()}));
    const tbody = document.querySelector("#payoutTable tbody");
    tbody.innerHTML = rows.map(p => `
      <tr>
        <td>${p.store}</td><td>${p.name}</td><td>${p.monthKey}</td><td>¥${p.amount}</td>
        <td><span class="tag ${p.status==='支給済み'?'done':'pending'}">${p.status}</span></td>
        <td>${p.status==='未支給' ? `<button class="secondary" onclick="markPaid('${p.id}')">支給済みにする</button>` : ''}</td>
      </tr>`).join("");
  });
}
window.markPaid = async (id) => {
  await updateDoc(doc(db,"payouts",id), {status:"支給済み", paidAt:new Date()});
};

// ---------- ビンゴ内容編集 ----------
async function loadBingoEdit(){
  const snap = await getDoc(doc(db,"bingoConfig","shared"));
  const items = (snap.exists() && snap.data().items) ? snap.data().items : DEFAULT_ITEMS;
  const wrap = document.getElementById("bingoEditGrid");
  wrap.innerHTML = items.map((t,i) => `<label>${i+1}マス目</label><textarea rows="2" data-idx="${i}">${t}</textarea>`).join("");
}
window.saveBingoConfig = async () => {
  const items = Array.from(document.querySelectorAll("#bingoEditGrid textarea")).map(t => t.value);
  await setDoc(doc(db,"bingoConfig","shared"), {items, updatedAt:new Date()});
  document.getElementById("bingoSaveMsg").textContent = "保存しました！スタッフ用アプリに反映されます。";
  setTimeout(() => { document.getElementById("bingoSaveMsg").textContent = ""; }, 3000);
};

function initAll(){
  fillStoreSelects();
  watchStatus();
  watchMaster();
  watchPayouts();
  loadBingoEdit();
}
</script>
</body>
</html>
